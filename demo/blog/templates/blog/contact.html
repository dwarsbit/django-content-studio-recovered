<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact · Northbound</title>
<style nonce="{{ csp_nonce }}">
  :root { --fg:#1b1b18; --muted:#6b6a63; --bg:#fbfaf6; --line:#e6e3da; --accent:#b4532a; }
  @media (prefers-color-scheme: dark) { :root { --fg:#ecebe6; --muted:#a3a29b; --bg:#151513; --line:#2c2b27; --accent:#e08a5f; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font: 17px/1.65 Georgia, "Times New Roman", serif; }
  header.site { max-width:1080px; margin:0 auto; padding:22px 24px; border-bottom:1px solid var(--line); }
  .brand { font-size:26px; letter-spacing:.02em; font-weight:700; }
  main { max-width:560px; margin:0 auto; padding:44px 24px 80px; }
  h1 { font-size:40px; line-height:1.12; margin:0 0 24px; }
  form p { margin:0 0 18px; }
  label { display:block; font: 600 14px system-ui, sans-serif; margin-bottom:6px; }
  input, textarea { width:100%; font: 16px system-ui, sans-serif; padding:10px 12px; border:1px solid var(--line); border-radius:6px; background:transparent; color:inherit; }
  textarea { min-height:120px; }
  button { font: 600 15px system-ui, sans-serif; padding:10px 18px; border:0; border-radius:6px; background:var(--accent); color:#fff; cursor:pointer; }
  .errorlist { color:#b42318; font: 14px system-ui, sans-serif; list-style:none; padding:0; margin:6px 0 0; }
  .sent { font: 15px system-ui, sans-serif; padding:12px 14px; border:1px solid var(--line); border-radius:6px; margin-bottom:24px; }
</style>
{{ form.media }}
</head>
<body>
<header class="site"><div class="brand">Northbound</div></header>
<main>
  <h1>Contact us</h1>
  {% if sent %}<p class="sent" role="status">Thanks, your message was sent.</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Send</button>
  </form>
</main>
</body>
</html>
