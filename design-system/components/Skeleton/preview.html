<!doctype html>
<html>
<head><meta charset="utf-8"><title>Skeleton preview</title>
<style>body{margin:0;padding:16px;font-family:var(--font-sans);font-size:13px;line-height:1.5;color:var(--foreground);background:var(--background)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.col{display:flex;flex-direction:column;gap:12px;max-width:360px}
label{display:flex;align-items:center;gap:8px}</style></head>
<body>
<div id="root"></div>
<script>
var C = window.ContentStudio, h = React.createElement;
ReactDOM.createRoot(document.getElementById("root")).render(h("div", { className: "row", style: { gap: 24, alignItems: "flex-start" } },
  h("div", { className: "col", style: { width: 240 } },
    h("span", { style: { fontWeight: 500 } }, "Title"),
    h(C.Skeleton, { className: "h-9 w-full rounded-lg" }),
    h(C.Skeleton, { className: "h-3.5 w-3/4" }),
    h(C.Skeleton, { className: "h-3.5 w-1/2" })),
  h("div", { className: "col", style: { width: 160 } },
    h(C.Skeleton, { className: "aspect-[4/3] w-full rounded-lg" }),
    h(C.Skeleton, { className: "h-3.5 w-2/3" }))));
</script>
</body>
</html>
