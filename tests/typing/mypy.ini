# mypy for tests/typing/public_api.py; see tests/typing/README.md.
[mypy]
plugins = mypy_django_plugin.main, mypy_drf_plugin.main
strict_optional = True
check_untyped_defs = True
warn_unused_ignores = True
# Like an installed package: only errors in the user code count.
[mypy-content_studio.*]
ignore_errors = True
[mypy-tests.*]
ignore_errors = True
[mypy-tests.typing.*]
ignore_errors = False

[mypy.plugins.django-stubs]
django_settings_module = tests.settings
