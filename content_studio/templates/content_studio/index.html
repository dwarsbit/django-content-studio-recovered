{% load static %}
<!DOCTYPE html>
<html lang="{{ language }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="{% if favicon %}{{ favicon }}{% else %}{% static 'content_studio/img/favicon.png' %}{% endif %}">
    <title>{{ page_title|default:"Django Content Studio" }}</title>
    <script>
        window.DCS_STATIC_PREFIX = "{% get_static_prefix %}content_studio/";
        window.DCS_BASENAME = "{% url 'content_studio_web' %}";
        window.DCS_LANGUAGE = "{{ language|escapejs }}";
        window.DCS_ASSET_TOKEN = "{{ asset_token|escapejs }}";
    </script>
    <script type="module" crossorigin src="{% static 'content_studio/assets/index.js' %}?v={{ asset_token }}"></script>
    <link rel="stylesheet" crossorigin href="{% static 'content_studio/assets/index.css' %}?v={{ asset_token }}">
    <link rel="stylesheet" crossorigin href="{% static 'content_studio/fonts/inter/index.css' %}?v={{ asset_token }}">
    <link rel="stylesheet" crossorigin href="{% static 'content_studio/icons/pi/style.css' %}?v={{ asset_token }}">
    {% if accent_css %}<style id="dcs-accent">{{ accent_css }}</style>{% endif %}
    {{ languages|json_script:"dcs-languages" }}
</head>
<body>
    <div id="root"></div>
</body>
</html>
